[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200

[[redirects]]
  from = "/api/account-sync"
  to = "/.netlify/functions/account-sync"
  status = 200

[[redirects]]
  from = "/api/accreditation"
  to = "/.netlify/functions/accreditation"
  status = 200

[[redirects]]
  from = "/api/accreditation-evidence"
  to = "/.netlify/functions/accreditation-evidence"
  status = 200

[[redirects]]
  from = "/api/accreditation-actions"
  to = "/.netlify/functions/accreditation-actions"
  status = 200

[[redirects]]
  from = "/api/policy-document"
  to = "/.netlify/functions/policy-document"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
